appId: com.morz.app
productName: Morz

directories:
  buildResources: resources
  output: release

files:
  - out/**
  - resources/**
  # npm alias dependencies are not discovered reliably by electron-builder's
  # production-dependency walker. Include the prebuilt ConPTY package explicitly;
  # asarUnpack below keeps its native binary and DLLs on disk.
  - from: node_modules/@lydell/node-pty-win32-x64
    to: node_modules/@lydell/node-pty-win32-x64
    filter:
      - '**/*'
  # chokidar is bundled, but its transitive dependency lives through the
  # workspace node_modules junction and is missed by electron-builder.
  - from: node_modules/readdirp
    to: node_modules/readdirp
    filter:
      - '**/*'
  # better-sqlite3 loads its prebuilt binary through bindings at runtime.
  - from: node_modules/bindings
    to: node_modules/bindings
    filter:
      - '**/*'
  - from: node_modules/file-uri-to-path
    to: node_modules/file-uri-to-path
    filter:
      - '**/*'
  - '!src/**'
  - '!docs/**'
  - '!db/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{components.json,README.md}'
  - '!{.env,.env.*,.npmrc}'

# node-pty (@lydell prebuilt N-API) + better-sqlite3 ship prebuilt binaries —
# they must load from disk, not from inside the asar archive.
asarUnpack:
  - '**/node_modules/@lydell/**'
  - '**/node_modules/node-pty/**'
  - '**/node_modules/better-sqlite3/**'

# Native modules are prebuilt N-API — never rebuild against Electron headers.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

win:
  executableName: Morz
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

mac:
  icon: resources/icon.icns

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  deleteAppDataOnUninstall: false

# electron-updater feed config. Publishing stays manual/off for now
# (builds run with --publish never); flip when signing is set up.
publish:
  provider: github
  owner: orlrami
  repo: morz
